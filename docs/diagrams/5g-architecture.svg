<svg viewBox="0 0 1060 780" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">5G Standalone core architecture and traffic flow</title>
  <desc id="d">A UERANSIM RAN (UE and gNB) connects to an Open5GS control plane (service-based architecture with AMF, SMF and shared network functions on an SBI bus) and a UPF user plane, which reaches the data network. Lab security tooling attaches to the N3 and N4 interfaces for attack generation and packet capture.</desc>

  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#185FA5"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/>
    </marker>
    <marker id="aCoral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D85A30"/>
    </marker>
    <marker id="aGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888780"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="780" fill="#FBFAF7"/>

  <!-- Title -->
  <text x="40" y="46" font-size="25" font-weight="700" fill="#2C2C2A">5G Standalone Core — Components &amp; Traffic Flow</text>
  <text x="40" y="72" font-size="14.5" fill="#5F5E5A">Open5GS core · UERANSIM simulated RAN · lab security tooling on N3 / N4</text>

  <!-- ================= RAN ================= -->
  <rect x="40" y="150" width="185" height="215" rx="12" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="1.5"/>
  <text x="132" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#3C3489">RAN — UERANSIM</text>
  <rect x="62" y="192" width="140" height="58" rx="9" fill="#534AB7"/>
  <text x="132" y="217" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">UE</text>
  <text x="132" y="235" text-anchor="middle" font-size="11.5" fill="#EEEDFE">subscriber device</text>
  <rect x="62" y="272" width="140" height="72" rx="9" fill="#7F77DD"/>
  <text x="132" y="302" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">gNB</text>
  <text x="132" y="321" text-anchor="middle" font-size="11.5" fill="#EEEDFE">software radio (N2/N3)</text>
  <line x1="132" y1="250" x2="132" y2="272" stroke="#3C3489" stroke-width="1.5"/>

  <!-- ================= CONTROL PLANE ================= -->
  <rect x="300" y="108" width="530" height="205" rx="12" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1.5"/>
  <text x="565" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#0C447C">Control Plane — Service-Based Architecture</text>

  <!-- NF chips -->
  <g font-size="12" font-weight="600" fill="#0C447C" text-anchor="middle">
    <rect x="318" y="146" width="63" height="30" rx="7" fill="#B5D4F4"/><text x="349.5" y="166">NRF</text>
    <rect x="388" y="146" width="63" height="30" rx="7" fill="#B5D4F4"/><text x="419.5" y="166">AUSF</text>
    <rect x="458" y="146" width="63" height="30" rx="7" fill="#B5D4F4"/><text x="489.5" y="166">UDM</text>
    <rect x="528" y="146" width="63" height="30" rx="7" fill="#B5D4F4"/><text x="559.5" y="166">UDR</text>
    <rect x="598" y="146" width="63" height="30" rx="7" fill="#B5D4F4"/><text x="629.5" y="166">PCF</text>
    <rect x="668" y="146" width="63" height="30" rx="7" fill="#B5D4F4"/><text x="699.5" y="166">NSSF</text>
    <rect x="738" y="146" width="63" height="30" rx="7" fill="#B5D4F4"/><text x="769.5" y="166">SCP</text>
  </g>

  <!-- SBI bus -->
  <line x1="330" y1="196" x2="800" y2="196" stroke="#378ADD" stroke-width="2.5"/>
  <text x="800" y="190" text-anchor="end" font-size="11.5" font-style="italic" fill="#185FA5">SBI · HTTP/2</text>
  <g stroke="#378ADD" stroke-width="1.3">
    <line x1="349.5" y1="176" x2="349.5" y2="196"/><line x1="419.5" y1="176" x2="419.5" y2="196"/>
    <line x1="489.5" y1="176" x2="489.5" y2="196"/><line x1="559.5" y1="176" x2="559.5" y2="196"/>
    <line x1="629.5" y1="176" x2="629.5" y2="196"/><line x1="699.5" y1="176" x2="699.5" y2="196"/>
    <line x1="769.5" y1="176" x2="769.5" y2="196"/>
  </g>

  <!-- AMF + SMF -->
  <rect x="372" y="230" width="120" height="62" rx="9" fill="#378ADD"/>
  <text x="432" y="257" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">AMF</text>
  <text x="432" y="276" text-anchor="middle" font-size="11" fill="#E6F1FB">access &amp; mobility</text>
  <line x1="432" y1="196" x2="432" y2="230" stroke="#378ADD" stroke-width="1.5"/>
  <rect x="600" y="230" width="120" height="62" rx="9" fill="#378ADD"/>
  <text x="660" y="257" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">SMF</text>
  <text x="660" y="276" text-anchor="middle" font-size="11" fill="#E6F1FB">session mgmt</text>
  <line x1="660" y1="196" x2="660" y2="230" stroke="#378ADD" stroke-width="1.5"/>

  <!-- ================= USER PLANE (UPF) ================= -->
  <rect x="470" y="420" width="160" height="82" rx="11" fill="#1D9E75"/>
  <text x="550" y="452" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">UPF</text>
  <text x="550" y="472" text-anchor="middle" font-size="11.5" fill="#E1F5EE">User Plane Function</text>
  <text x="550" y="489" text-anchor="middle" font-size="10.5" fill="#9FE1CB">GTP-U ⇄ data network</text>

  <!-- ================= DATA NETWORK ================= -->
  <rect x="870" y="428" width="155" height="70" rx="11" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5"/>
  <text x="947" y="458" text-anchor="middle" font-size="14" font-weight="700" fill="#2C2C2A">Data Network</text>
  <text x="947" y="477" text-anchor="middle" font-size="11.5" fill="#5F5E5A">internet (N6)</text>

  <!-- ================= FLOW ARROWS ================= -->
  <!-- N2: gNB -> AMF (signaling) -->
  <path d="M202 288 C 300 268, 300 262, 372 262" fill="none" stroke="#185FA5" stroke-width="2.2" marker-end="url(#aBlue)"/>
  <rect x="238" y="238" width="132" height="20" rx="5" fill="#FBFAF7"/>
  <text x="304" y="252" text-anchor="middle" font-size="11.5" font-weight="600" fill="#185FA5">N1/N2 · NGAP/SCTP</text>

  <!-- N3: gNB -> UPF (user plane) -->
  <path d="M150 344 C 150 470, 320 465, 470 460" fill="none" stroke="#0F6E56" stroke-width="3" marker-end="url(#aGreen)"/>
  <rect x="196" y="452" width="196" height="20" rx="5" fill="#FBFAF7"/>
  <text x="294" y="466" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F6E56">N3 · GTP-U (UDP/2152)</text>

  <!-- N4: SMF -> UPF (control over user plane) -->
  <path d="M636 292 C 620 350, 600 380, 585 420" fill="none" stroke="#185FA5" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#aBlue)"/>
  <rect x="614" y="346" width="168" height="20" rx="5" fill="#FBFAF7"/>
  <text x="698" y="360" text-anchor="middle" font-size="11.5" font-weight="600" fill="#185FA5">N4 · PFCP (UDP/8805)</text>

  <!-- N6: UPF -> Data Network -->
  <path d="M630 462 L 870 462" fill="none" stroke="#0F6E56" stroke-width="3" marker-end="url(#aGreen)"/>
  <rect x="720" y="452" width="60" height="20" rx="5" fill="#FBFAF7"/>
  <text x="750" y="466" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F6E56">N6</text>

  <!-- ================= LAB TOOLING ================= -->
  <rect x="300" y="560" width="530" height="140" rx="12" fill="#FAECE7" stroke="#F0997B" stroke-width="1.5"/>
  <text x="565" y="586" text-anchor="middle" font-size="14" font-weight="700" fill="#712B13">Lab Security Tooling — attaches to N3 / N4</text>

  <rect x="322" y="602" width="232" height="78" rx="9" fill="#D85A30"/>
  <text x="438" y="628" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">attacks/</text>
  <text x="438" y="648" text-anchor="middle" font-size="10.8" fill="#FAECE7">malformed GTP-U · PFCP flood</text>
  <text x="438" y="663" text-anchor="middle" font-size="10.8" fill="#FAECE7">assoc abuse · signaling storm</text>

  <rect x="576" y="602" width="232" height="78" rx="9" fill="#993C1D"/>
  <text x="692" y="628" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">capture/</text>
  <text x="692" y="648" text-anchor="middle" font-size="10.8" fill="#F5C4B3">tcpdump N3+N4 → features</text>
  <text x="692" y="663" text-anchor="middle" font-size="10.8" fill="#F5C4B3">labeled dataset → model (Idea 2)</text>

  <!-- attacks inject into N3/N4 near UPF -->
  <path d="M470 602 C 470 545, 505 525, 522 502" fill="none" stroke="#D85A30" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aCoral)"/>
  <!-- capture taps the segment -->
  <path d="M660 602 C 640 550, 610 525, 600 502" fill="none" stroke="#D85A30" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aCoral)"/>
  <text x="472" y="536" font-size="10.5" font-style="italic" fill="#993C1D">inject</text>
  <text x="628" y="536" font-size="10.5" font-style="italic" fill="#993C1D">tap</text>

  <!-- ================= LEGEND ================= -->
  <text x="880" y="590" font-size="12.5" font-weight="700" fill="#2C2C2A">Legend</text>
  <line x1="880" y1="608" x2="912" y2="608" stroke="#0F6E56" stroke-width="3"/>
  <text x="920" y="612" font-size="11.5" fill="#444441">User-plane data</text>
  <line x1="880" y1="630" x2="912" y2="630" stroke="#185FA5" stroke-width="2.2"/>
  <text x="920" y="634" font-size="11.5" fill="#444441">Control / signaling</text>
  <line x1="880" y1="652" x2="912" y2="652" stroke="#185FA5" stroke-width="2.2" stroke-dasharray="7 5"/>
  <text x="920" y="656" font-size="11.5" fill="#444441">PFCP (N4)</text>
  <line x1="880" y1="674" x2="912" y2="674" stroke="#D85A30" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="920" y="678" font-size="11.5" fill="#444441">Lab tooling</text>
</svg>
