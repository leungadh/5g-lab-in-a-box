# cSRX secure-wire GTP firewall — Junos configuration TEMPLATE (Phase 1 testbed)
#
# Load into the running cSRX:
#   docker exec -it csrx cli
#   configure
#   load set terminal        <- then paste the "set ..." lines below, Ctrl-D
#   commit and-quit
#
# !! VERIFY every statement against YOUR cSRX / Junos version. The exact GTP
#    profile knobs vary by release — see the "Securing GTP and SCTP Traffic"
#    guide (linked in docs/FIREWALL.md). This is a starting point, not gospel.

# --- data interfaces (the secure-wire pair) ---
set interfaces ge-0/0/0 unit 0 family ethernet-switching
set interfaces ge-0/0/1 unit 0 family ethernet-switching

# --- secure-wire: transparently bridge the two data interfaces at L2 ---
set security forwarding-options secure-wire GTP-WIRE interface ge-0/0/0.0
set security forwarding-options secure-wire GTP-WIRE interface ge-0/0/1.0

# --- security zones ---
set security zones security-zone untrust interfaces ge-0/0/0.0
set security zones security-zone trust interfaces ge-0/0/1.0
set security zones security-zone untrust screen GTP-SCREEN

# --- DoS screen: cap UDP flood  (mitigates gtpu_flood AND pfcp_session_flood) ---
# PFCP is UDP (port 8805), so this same zone-level UDP-flood screen rate-limits a
# PFCP session flood too. Set the threshold BELOW your attack rate but ABOVE normal
# PFCP chatter (which is low — mostly periodic heartbeats). Tune per your demo rates.
set security screen ids-option GTP-SCREEN udp flood threshold 2000

# --- GTP inspection profile: sanity + sequence checks, drop invalid GTP-U ---
#     This is the piece that stops `malformed_gtpu` (bad types / headers).
set security gprs gtp profile GTP-FW
set security gprs gtp profile GTP-FW traffic-logging
set security gprs gtp profile GTP-FW seq-number-validated
set security gprs gtp profile GTP-FW gtp-u-inspection
set security gprs gtp profile GTP-FW drop unknown-message
# (optional) per-tunnel rate limiting for extra flood protection:
# set security gprs gtp profile GTP-FW rate-limit <n>

# --- policy: permit GTP untrust->trust WITH the GTP profile applied ---
set security policies from-zone untrust to-zone trust policy gtp-inspect match source-address any
set security policies from-zone untrust to-zone trust policy gtp-inspect match destination-address any
set security policies from-zone untrust to-zone trust policy gtp-inspect match application junos-gtp
set security policies from-zone untrust to-zone trust policy gtp-inspect then permit application-services gprs-gtp-profile GTP-FW
set security policies from-zone untrust to-zone trust policy gtp-inspect then log session-init session-close

# --- PFCP (N4, UDP 8805): VOLUMETRIC defense only ---
# SRX has no deep PFCP protocol inspection, so the defense against pfcp_session_flood
# is rate-limiting via the UDP-flood screen above (which already covers UDP/8805).
# Here we just define PFCP as an application and permit it through the screened zone,
# so the flood is capped by the screen — NOT deep-validated. Subtle, low-rate PFCP
# abuse (forged associations, heartbeat manipulation) is out of the firewall's reach
# and is where the ML detector (../detector/) covers the gap.
set applications application pfcp protocol udp destination-port 8805
set security policies from-zone untrust to-zone trust policy pfcp-permit match source-address any
set security policies from-zone untrust to-zone trust policy pfcp-permit match destination-address any
set security policies from-zone untrust to-zone trust policy pfcp-permit match application pfcp
set security policies from-zone untrust to-zone trust policy pfcp-permit then permit
set security policies from-zone untrust to-zone trust policy pfcp-permit then log session-init

# To DEMONSTRATE the "before" state for GTP-U, comment out the application-services
# line in the gtp-inspect policy (permit plain GTP with no inspection) and re-run —
# the malformed traffic then reaches the target. Re-add it to show the block.
# For the PFCP flood, raise the screen threshold above the attack rate to show the
# "before" (flood gets through), then lower it to show the rate-limit kick in.
