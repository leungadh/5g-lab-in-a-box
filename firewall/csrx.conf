# cSRX flood firewall — ROUTED mode (Junos set-format)  [Part 1 standalone testbed]
#
# IMPORTANT: cSRX does NOT include the GTP/SCTP ALG — that is vSRX / physical SRX.
# So cSRX cannot deep-inspect or drop malformed GTP-U. What cSRX CAN do is rate-limit
# volumetric floods with a DoS SCREEN. This config does exactly that:
#   - L3 interfaces (routed mode)      - untrust/trust zones
#   - UDP-flood screen (caps floods)   - permit policy untrust -> trust
#
# Load into the running cSRX:
#   docker cp firewall/csrx.conf csrx:/tmp/csrx.conf   (or the extracted set file)
#   docker exec -it csrx cli ; configure ; load set /tmp/csrx.set ; commit
#
# Interface->network mapping depends on docker attach ORDER (fw-left first = ge-0/0/0).
# After commit, run `show interfaces terse` and confirm ge-0/0/0 = 10.10.1.2; if the
# two are swapped, swap the addresses below.

# --- L3 data interfaces (routed mode) ---
set interfaces ge-0/0/0 unit 0 family inet address 10.10.1.2/24
set interfaces ge-0/0/1 unit 0 family inet address 10.10.2.2/24

# --- zones ---
set security zones security-zone untrust interfaces ge-0/0/0.0 host-inbound-traffic system-services all
set security zones security-zone untrust screen FLOOD-SCREEN
set security zones security-zone trust interfaces ge-0/0/1.0 host-inbound-traffic system-services all

# --- DoS screen: rate-limit UDP flood ---
# Covers BOTH the GTP-U flood (UDP 2152) and the PFCP session flood (UDP 8805).
# Set the threshold (packets/sec) BELOW your attack rate but ABOVE normal traffic.
set security screen ids-option FLOOD-SCREEN udp flood threshold 1000

# --- policy: permit untrust -> trust (so normal traffic routes through) ---
set security policies from-zone untrust to-zone trust policy permit-all match source-address any
set security policies from-zone untrust to-zone trust policy permit-all match destination-address any
set security policies from-zone untrust to-zone trust policy permit-all match application any
set security policies from-zone untrust to-zone trust policy permit-all then permit
set security policies from-zone untrust to-zone trust policy permit-all then log session-init session-close

# NOTE: malformed GTP-U is NOT blocked here — cSRX has no GTP inspection, so it passes
# through. That's by design of the layering: the firewall caps the volumetric floods,
# and the ML detector (../detector/) catches the malformed / protocol-abuse traffic.
